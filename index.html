<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-address-book"></i></div>
        <div>
          <h1>Contact<span>Hub</span></h1>
          <p>Smart Contact Manager</p>
        </div>
      </div>
      <button class="btn btn-primary" id="openModalBtn"><i class="fa-solid fa-plus"></i> Add Contact</button>
    </div>
  </header>
  <main class="container">
    <section class="stats">
      <div class="stat"><div class="icon blue"><i class="fa-solid fa-users"></i></div><div><small>TOTAL</small><h3 id="totalCount">0</h3></div></div>
      <div class="stat"><div class="icon orange"><i class="fa-solid fa-star"></i></div><div><small>FAVORITES</small><h3 id="favCount">0</h3></div></div>
      <div class="stat"><div class="icon red"><i class="fa-solid fa-heart-pulse"></i></div><div><small>EMERGENCY</small><h3 id="emCount">0</h3></div></div>
    </section>
    <section class="layout">
      <div>
        <h2 class="title">All Contacts</h2>
        <p class="muted">Manage and organize your <span id="subCount">0</span> contacts</p>
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search by name, phone, or email...">
        </div>
        <div id="contactsList" class="contacts"></div>
      </div>
      <aside>
        <div class="side-card">
          <div class="side-head orange-bg"><div class="icon orange"><i class="fa-solid fa-star"></i></div>
            <div><h4>Favorites</h4><p>Quick access to starred contacts</p></div></div>
          <div id="favList" class="side-body"></div>
        </div>
        <div class="side-card">
          <div class="side-head red-bg"><div class="icon red"><i class="fa-solid fa-heart-pulse"></i></div>
            <div><h4>Emergency</h4><p>Important contacts for urgent calls</p></div></div>
          <div id="emList" class="side-body"></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Add New Contact</h3>
        <button class="close" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="photo-box">
          <div class="avatar big" id="photoPreview"><i class="fa-solid fa-user"></i></div>
          <label class="btn btn-light"><i class="fa-solid fa-camera"></i> Change Photo
            <input type="file" id="photoInput" accept="image/*" hidden>
          </label>
        </div>
        <label>Full Name <b class="req">*</b></label>
        <input type="text" id="nameInput" placeholder="Enter full name">
        <label>Phone Number <b class="req">*</b></label>
        <input type="tel" id="phoneInput" placeholder="e.g., 01012345678">
        <label>Email Address</label>
        <input type="email" id="emailInput" placeholder="name@example.com">
        <label>Address</label>
        <input type="text" id="addressInput" placeholder="Enter address">
        <label>Group</label>
        <select id="groupInput">
          <option value="">Select a group</option>
          <option value="Family">Family</option>
          <option value="Friends">Friends</option>
          <option value="Work">Work</option>
          <option value="Other">Other</option>
        </select>
        <label>Notes</label>
        <textarea id="notesInput" rows="3" placeholder="Add notes about this contact"></textarea>
        <div class="checks">
          <label class="check"><input type="checkbox" id="favInput"> <i class="fa-solid fa-star star"></i> Favorite</label>
          <label class="check"><input type="checkbox" id="emInput"> <i class="fa-solid fa-heart-pulse heart"></i> Emergency</label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-light" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn"><i class="fa-solid fa-check"></i> Save Contact</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/script.js"></script>
</body>
</html>
